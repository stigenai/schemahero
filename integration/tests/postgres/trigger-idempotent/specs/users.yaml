database: schemahero
name: users
schema:
  postgres:
    primaryKey: [id]
    columns:
      - name: id
        type: integer
        constraints:
          notNull: true
      - name: email
        type: varchar(255)
        constraints:
          notNull: true
    triggers:
      - name: audit_users
        events:
          - after insert
          - after update
        forEachRow: true
        execute:
          type: Function
          name: audit_fn
